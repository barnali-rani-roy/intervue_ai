<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<div class="card" style="max-width:450px;margin:80px auto;">

<h2>Login</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">

<input
type="email"
name="email"
placeholder="Email"
required
class="input">

<br><br>

<input
type="password"
name="password"
placeholder="Password"
required
class="input">

<br><br>

<button class="btn btn-full">
Login
</button>

</form>

<br>

Don't have an account?

<a href="/register">
Create Account
</a>

</div>

</div>

</body>
</html>
