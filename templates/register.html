<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

    <div class="card" style="max-width:450px;margin:80px auto;">

        <h2>Create Account</h2>

        {% if error %}
        <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="name"
                placeholder="Full Name"
                required
                class="input"
            >

            <br><br>

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
                class="input"
            >

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
                class="input"
            >

            <br><br>

            <button class="btn btn-full">
                Register
            </button>

        </form>

        <br>

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>

</div>

</body>
</html>
